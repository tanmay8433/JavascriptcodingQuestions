<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debounce Example</title>
</head>
<body>
 <input type="text" oninput="handledebounce(event)"/>
 <script>
 
 let count=1;
 function getcount(){
   console.log("count",count++)
 }
 function ratethelimit(fn,delay){
       let timer;
     return function(...args){
         clearTimeout(timer)
         timer=setTimeout(()=>{
             fn.apply(this,args)
         },delay)
     }
 }
 let handledebounce=ratethelimit(getcount,1000)
 </script>
</body>
</html>
