<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div{
      min-width: 100px;
      min-height: 100px;
      padding: 30px;
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <div id="grandparent">
    <div id="parent">
      <div id="child">

      </div>
    </div>
  </div>
  <script >
    document.querySelector("#grandparent").addEventListener("click",()=>{
console.log("grandparent")
},true)
document.querySelector("#parent").addEventListener("click",()=>{
console.log("parent")
},true)
document.querySelector("#child").addEventListener("click",()=>{
console.log("child")
},true)

// true meaning capturing work top to bottom
// false meaning bubbling work bottom to top
  </script>
</body>
</html>
